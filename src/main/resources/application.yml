server:
  # Todos los recursos cuelgan de /api. Asi el nginx del despliegue tiene una
  # sola regla en vez de una por cada recurso del backend, y no hay que tocarlo
  # cada vez que aparezca uno nuevo.
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/b4rrhh}
    username: ${DB_USERNAME:b4rrhh}
    password: ${DB_PASSWORD:b4rrhh}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    org.flywaydb: info

app:
  # Acceso a la demo publica. Apagado por defecto: solo se enciende con la
  # variable DEMO_AUTH_ENABLED y ademas requiere el perfil 'demo'. Doble llave,
  # igual que dev-auth.
  demo-auth:
    enabled: ${DEMO_AUTH_ENABLED:false}
    # La contrasena se publica en la propia pantalla de acceso: la demo es para
    # que entre cualquiera. Sirve para que nadie entre sin querer, no para
    # impedir el paso. Aun asi va por entorno, no escrita aqui.
    password: ${DEMO_PASSWORD:}
    expires-in-minutes: 120
    # Sujetos que ya existen en authz.subject_role_assignment. 'bifor' (ADMIN)
    # no esta y no debe estar: nadie entra de administrador desde internet.
    subjects:
      hr.manager:
        - HR_MANAGER
      auditor:
        - AUDITOR
      readonly:
        - READONLY

  jwt:
    # En producción se define la variable JWT_SECRET. Si no se define, la
    # aplicación NO arranca: ver SecurityConfig.jwtDecoder(). El valor de abajo
    # es solo para desarrollo y está publicado en el repositorio, así que
    # cualquiera podría firmar tokens con él. Por eso el código lo rechaza
    # fuera del perfil local.
    secret: ${JWT_SECRET:dev-only-secreto-de-desarrollo-local-no-usar-en-produccion}

payroll:
  launch:
    execution:
      collapse-segment-rows: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:b4rrhh}
  secret-key: ${MINIO_SECRET_KEY:b4rrhh123}
  bucket-name: b4rrhh-employee-photos
  presigned-url-expiry-minutes: 10