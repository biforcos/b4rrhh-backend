# ============================================================
#  CI/CD del backend de B4RRHH
#
#  Igual que el de la web personal, con un paso mas por delante: aqui la
#  suite pasa ANTES de construir la imagen. El Dockerfile compila con
#  -DskipTests precisamente porque cuenta con este fichero.
#
#  La parte rara es el Postgres. Los tests usan Testcontainers, y el runner
#  de Gitea es dind: los puertos que Testcontainers publicaria se quedan en
#  el demonio, no en el contenedor del job, asi que el job no llegaria a
#  ellos. En vez de pelearse con eso, aqui se levanta el Postgres a mano en
#  una red propia y se corre Maven en esa misma red: se hablan por el DNS de
#  Docker, sin publicar un solo puerto. TestPostgres se aparta al ver
#  TEST_DB_HOST en el entorno.
#
#  Maven va en su propio contenedor y no en el del job a proposito: asi esto
#  no depende de que la imagen del runner traiga un JDK 21, y usa la misma
#  version de Maven que el Dockerfile.
# ============================================================
name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # La IP y no git.bifor.casa: la CT tiene DNS de Cloudflare y el firewall
  # solo le abre esta IP y este puerto.
  REGISTRY: 192.168.1.104:3000/b4rrhh
  IMAGEN: b4rrhh-api
  SERVIDOR: 192.168.1.151
  RED: ci-${{ github.sha }}
  PG: pg-${{ github.sha }}
  MVN: mvn-${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Comprobar que el bundle de ADR esta al dia
        run: |
          # El bundle se commitea, asi que puede quedarse por detras de
          # los ADR sin que nadie se entere, que es lo que paso y motivo
          # el issue #17. Se regenera aqui y se falla si el arbol queda
          # sucio: desde que el generador no escribe la fecha (#65) es
          # determinista, asi que sin ADR nuevos el diff sale vacio.
          #
          # python3 y no un contenedor aparte: la imagen del runner
          # (catthehacker/ubuntu:act-latest) lo trae, y el generador solo
          # usa la biblioteca estandar.
          python3 docs/architecture/adr/build-adr-bundle.py
          git diff --exit-code

      - name: Avisar a los consumidores del contrato
        # El contrato vive aqui y lo consumen DOS repositorios. Ponerlos al dia
        # es manual y ocurre en otro sitio, asi que dependia de que alguien se
        # acordara; van tres veces que no (b4rrhh/workspace#5).
        #
        # El aviso sale de aqui porque aqui esta el dato: este es el unico
        # repositorio que sabe que el contrato ha cambiado y quien lo consume.
        # Y no se limita a recordar: se trae la copia de cada uno y dice cual
        # esta atras, por su nombre y con la orden que lo arregla.
        #
        # Corre SIEMPRE y no solo cuando el commit toca openapi/. Mirar que ha
        # cambiado exigiria historia, y el checkout es superficial: un
        # `git diff` contra github.event.before no encuentra ese commit, falla,
        # y el paso se saltaria en silencio — un guardarrail que no guarda, que
        # es peor que ninguno. Costar, cuesta dos peticiones HTTP, y con los dos
        # consumidores al dia son dos lineas de log. Ademas asi tambien se ve al
        # consumidor que se quedo atras en un push anterior.
        #
        # AVISA Y NO FALLA, y no es tibieza: los consumidores se traen el
        # contrato de main, asi que TIENEN que estar atras mientras este job
        # corre. Fallar aqui seria fallar por una ventana que el propio orden
        # obliga a abrir, y ademas en el job que despliega. La palanca, si algun
        # dia se decide lo contrario, es `--fallar`.
        #
        # continue-on-error por si Gitea no contesta: que no se sepa el estado
        # de un consumidor no es motivo para no desplegar el backend.
        continue-on-error: true
        env:
          # La BASE de Gitea, no la URL de un fichero: aqui hay que pedir la
          # copia de dos repositorios. Mismo host y puerto que el registry de
          # arriba, con el que el runner ya habla en cada build.
          GITEA_URL: http://192.168.1.104:3000
          CONTRACT_TOKEN: ${{ secrets.CONTRACT_TOKEN }}
        run: python3 openapi/avisar-consumidores.py

      - name: Levantar el Postgres de los tests
        run: |
          # Por si una ejecucion anterior del mismo commit dejo restos.
          docker rm -f -v "${{ env.PG }}" "${{ env.MVN }}" 2>/dev/null || true
          docker network rm "${{ env.RED }}" 2>/dev/null || true

          docker network create "${{ env.RED }}"
          # Sin fsync ni escritura sincrona: esta base vive lo que dura el job y
          # muere con el. Que sobreviva a un corte de luz no aporta nada aqui.
          # NO se parece al Postgres de produccion en durabilidad, pero si en
          # todo lo que los tests comprueban: tipos, plegado de identificadores,
          # casts y restricciones.
          #
          # max_wal_size bajo: los clones de la plantilla del esquema real van
          # con STRATEGY = FILE_COPY (ver TestPostgres), asi que el WAL no tiene
          # que absorberlos; con el 1 GB por defecto tardaba en reciclarse y era
          # disco tirado (issue #12).
          #
          # Los datos se quedan en disco y no en tmpfs a proposito. Lo probamos
          # y estaba mal medido: el "io full" que vimos no lo causaba este
          # Postgres, sino la CT quedandose sin memoria y tirando de swap. Un
          # tmpfs aqui solo sirve para quedarse sin sitio a mitad de la suite y
          # fallar con un "No space left on device" que no dice nada.
          docker run -d --name "${{ env.PG }}" --network "${{ env.RED }}" \
            -e POSTGRES_DB=b4rrhh \
            -e POSTGRES_USER=b4rrhh \
            -e POSTGRES_PASSWORD=b4rrhh \
            postgres:16 postgres \
              -c max_connections=300 \
              -c fsync=off \
              -c full_page_writes=off \
              -c synchronous_commit=off \
              -c max_wal_size=256MB

          # Sin esperar aqui, el primer contexto de Spring se encuentra la
          # base a medio arrancar y el fallo aparece en un test cualquiera.
          for i in $(seq 1 40); do
            docker exec "${{ env.PG }}" pg_isready -U b4rrhh -d b4rrhh && break
            sleep 2
          done

      - name: Pasar la suite
        run: |
          # TZ y no MAVEN_OPTS: Surefire forkea otro JVM que no hereda
          # MAVEN_OPTS, asi que los tests correrian en UTC. Con nomina de por
          # medio, una hora de diferencia entre tu maquina y el pipeline es un
          # fallo que no se reproduce.
          #
          # Techos calculados sobre lo que tiene la CT104 (8 hilos, 12 GB), no
          # sobre el nodo. Sin ellos, Maven se come la CT entera, y ahi dentro
          # vive tambien el Gitea que te ensena si el pipeline va bien: la
          # primera vez, el build tumbo la web que tenia que informar del build.
          # Dejando 3 hilos y ~5 GB libres, Gitea sigue respondiendo mientras
          # se construye.
          #
          # JAVA_TOOL_OPTIONS y no MAVEN_OPTS: el JVM lo lee del entorno al
          # arrancar, asi que le llega tambien al que forkea Surefire, que es
          # el que de verdad necesita el heap. Si algun dia aparece un
          # OutOfMemoryError, se sube este porcentaje o el -m; no se quitan.
          docker create \
            --name "${{ env.MVN }}" \
            --network "${{ env.RED }}" \
            --cpus 5 \
            -m 6g \
            -e JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 \
            -e TEST_DB_HOST="${{ env.PG }}" \
            -e TZ=Europe/Madrid \
            -v b4rrhh-m2:/root/.m2 \
            -w /app \
            maven:3.9-eclipse-temurin-21 \
            mvn -B test

          # docker cp y no un bind mount: el demonio es el de dind y no ve el
          # disco de este contenedor, asi que el codigo hay que enviarselo.
          #
          # El "/." del final no es adorno. docker create -w /app ya ha creado
          # /app, y contra un destino que existe "cp origen dest" copia la
          # CARPETA dentro (/app/backend/pom.xml). Con "/." copia su contenido.
          docker cp "$GITHUB_WORKSPACE/." "${{ env.MVN }}":/app

          # -a engancha la salida y devuelve el codigo de salida de Maven:
          # si la suite falla, el paso falla.
          docker start -a "${{ env.MVN }}"

      - name: Entrar en el registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Construir y subir la imagen
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGEN }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGEN }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGEN }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGEN }}:latest

      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H ${{ env.SERVIDOR }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Desplegar
        run: |
          # Solo se toca .env.api-tag. El del front vive aparte para que
          # publicar el backend no le cambie la imagen al frontend.
          ssh -i ~/.ssh/deploy deploy@${{ env.SERVIDOR }} \
            "cd /opt/b4rrhh && \
             [ -f .env.web-tag ] || echo 'WEB_TAG=latest' > .env.web-tag && \
             [ -f .env.designer-tag ] || echo 'DESIGNER_TAG=latest' > .env.designer-tag && \
             echo 'API_TAG=${{ github.sha }}' > .env.api-tag && \
             docker compose --env-file .env --env-file .env.api-tag --env-file .env.web-tag --env-file .env.designer-tag pull api && \
             docker compose --env-file .env --env-file .env.api-tag --env-file .env.web-tag --env-file .env.designer-tag up -d && \
             docker image prune -f"

      - name: Comprobar que sigue en pie
        run: |
          sleep 15
          ssh -i ~/.ssh/deploy deploy@${{ env.SERVIDOR }} \
            "cd /opt/b4rrhh && docker compose ps --format '{{.Name}} {{.Status}}'"

      - name: Decir si la demo se queda con la semilla atrasada
        # No falla el despliegue, y esa es la decision del paso: desplegar una
        # API mas nueva que la semilla es legitimo -casi todos los despliegues
        # lo son- y a veces es justo lo que quieres. Lo que no es legitimo es no
        # enterarse (deploy#13).
        #
        # Por que importa desde el backend#107: la marca de "las reglas han
        # cambiado" compara el updated_at de la reglamentacion con el
        # calculated_at del recibo. Una migracion que toque payroll_engine deja
        # el primero en esta madrugada -el reinicio de las 4:30 restaura el
        # volcado viejo y Flyway vuelve a aplicarla al arrancar- y el segundo en
        # el dia que se capturo la semilla. La marca sale entonces en TODOS los
        # recibos, todas las mananas, y tiene razon: estan calculados con reglas
        # que el motor ya no tiene. Una marca que sale siempre no dice nada, que
        # es justo el escenario que el backend#107 descarto al elegir como medir
        # el cambio.
        #
        # La direccion contraria -un volcado mas nuevo que la API- la vigila el
        # sembrar-demo.yml del repositorio deploy, y aquella si para: Flyway
        # encuentra en flyway_schema_history migraciones que su jar no conoce y
        # se niega a arrancar. Esta no rompe nada, asi que solo habla.
        continue-on-error: true
        run: |
          # Sin -e a proposito: se quieren las dos mitades y el veredicto, no la
          # primera que falle. Cada camino dice lo suyo y termina en 0; el
          # continue-on-error de arriba es la red para lo que no este previsto,
          # porque a estas alturas la API YA esta desplegada y marcar en rojo un
          # despliegue que salio bien es mentir en la otra direccion.
          set -uo pipefail

          en_la_ct() { ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/deploy deploy@${{ env.SERVIDOR }} "$1"; }

          # La que la API VA a conocer se lee de los ficheros de migracion de
          # este arbol, que es exactamente lo que viaja dentro del jar que se
          # acaba de subir. No se le pregunta a la base de la demo a proposito:
          # ahi Flyway ya ha aplicado lo que faltaba al arrancar, asi que las dos
          # mitades de la comparacion saldrian del mismo sitio y coincidirian por
          # construccion, que es la forma de comprobar que no comprueba nada.
          #
          # El sort no es alfabetico: en texto '99' es mayor que '135'. Y por
          # campos numericos separados por punto, que una version puede ser '1.2'.
          DE_LA_API=$(ls src/main/resources/db/migration/V*__*.sql 2>/dev/null \
                      | sed -n 's|.*/V\([0-9][0-9.]*\)__.*|\1|p' \
                      | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          [ -n "$DE_LA_API" ] || DE_LA_API=NO-SE-SABE

          COMPOSE='docker compose --env-file .env --env-file .env.api-tag --env-file .env.web-tag --env-file .env.designer-tag'
          MIRADOR=b4rrhh_mirando_semilla_api

          # La version del volcado va DENTRO del volcado (deploy#4), asi que para
          # leerla hay que restaurarlo. Solo --schema=deploy, que son unas pocas
          # filas frente a una base de mil empleados, y a una base de usar y
          # tirar: la de la demo no se toca. El || true es porque pg_restore
          # protesta si el esquema no esta, y que no este es un caso previsto.
          #
          # El 'create schema deploy' NO sobra, y costo encontrarlo: con
          # --schema=deploy, pg_restore selecciona los objetos QUE ESTAN EN ese
          # esquema, y la entrada que lo crea no esta en ninguno -sale como
          # "SCHEMA - deploy"-, asi que queda fuera del filtro. Sin crearlo
          # antes, el CREATE TABLE falla con 'schema "deploy" does not exist',
          # el || true se lo traga, y la tabla no llega: la comparacion sale
          # "NO-SE-SABE" SIEMPRE y este paso no avisa nunca. Se vio provocandolo
          # (criterio 3 del deploy#13); leyendo el script no se ve.
          en_la_ct "cd /opt/b4rrhh && $COMPOSE exec -T postgres psql -qX -U b4rrhh -d postgres -c 'drop database if exists $MIRADOR' -c 'create database $MIRADOR owner b4rrhh'" >/dev/null 2>&1
          en_la_ct "cd /opt/b4rrhh && $COMPOSE exec -T postgres psql -qX -U b4rrhh -d $MIRADOR -c 'create schema if not exists deploy'" >/dev/null 2>&1
          # El codigo de salida se mira, y no por simetria: con '|| true' a
          # secas, un restore que falla de verdad y un volcado que no trae la
          # tabla dan los dos NO-SE-SABE, o sea la misma frase para un fallo y
          # para un caso legitimo. Es la forma exacta del b4rrhh/deploy#15, y
          # ese barrido pasa tambien por aqui. pg_restore sale con 0 cuando el
          # volcado no trae el esquema, asi que un codigo distinto de 0 es
          # siempre un fallo de verdad.
          RESTAURA_RC=0
          SALIDA_RESTAURA=$(en_la_ct "cd /opt/b4rrhh && $COMPOSE exec -T postgres pg_restore -U b4rrhh -d $MIRADOR --no-owner --schema=deploy < demo-seed.dump" 2>&1) || RESTAURA_RC=$?

          if [ "$RESTAURA_RC" != "0" ]; then
            echo "No se ha podido leer el volcado de la CT para compararlo:"
            printf '%s\n' "$SALIDA_RESTAURA" | head -5
            echo
            echo "pg_restore salio con $RESTAURA_RC. Eso NO es 'el volcado no trae"
            echo "deploy.semilla' ni 'la semilla esta al dia': es que no se sabe."
            echo "El despliegue esta hecho y no se toca por esto."
            exit 0
          fi

          preguntar() { en_la_ct "cd /opt/b4rrhh && $COMPOSE exec -T postgres psql -tAX -U b4rrhh -d $MIRADOR -c \"$1\" 2>/dev/null" | tr -d '[:space:]'; }

          # En dos veces y no con un CASE: Postgres planifica la consulta entera
          # antes de ejecutarla, asi que una rama que nombra deploy.semilla falla
          # igual cuando la tabla no esta, y ese fallo se leeria como "no se pudo
          # preguntar" en vez de como "el volcado no lo trae".
          DEL_VOLCADO=NO-SE-SABE
          if [ -n "$(preguntar "select coalesce(to_regclass('deploy.semilla')::text, '')")" ]; then
            LEIDO=$(preguntar "select coalesce(max(esquema_version), '') from deploy.semilla")
            [ -n "$LEIDO" ] && DEL_VOLCADO="$LEIDO"
          fi

          en_la_ct "cd /opt/b4rrhh && $COMPOSE exec -T postgres psql -qX -U b4rrhh -d postgres -c 'drop database if exists $MIRADOR'" >/dev/null 2>&1

          # "no se sabe" se escribe como lo que es y no como "vNO-SE-SABE", que
          # se lee a medias como si fuera un numero de version.
          comover() { if [ "$1" = "NO-SE-SABE" ]; then printf 'no se sabe'; else printf 'v%s' "$1"; fi; }

          echo "Ultima migracion que conoce la API recien desplegada: $(comover "$DE_LA_API")"
          echo "Esquema con el que se capturo la semilla de la CT:     $(comover "$DEL_VOLCADO")"
          echo

          # "No se sabe" no es "no cuadra", y no se disfraza de nada: un volcado
          # capturado antes del deploy#4 no trae deploy.semilla, y leer eso como
          # un descuadre seria inventarse una alarma.
          if [ "$DEL_VOLCADO" = "NO-SE-SABE" ] || [ "$DE_LA_API" = "NO-SE-SABE" ]; then
            echo "No se ha podido comparar: falta una de las dos mitades."
            echo "Esto NO dice que la semilla este al dia ni que no lo este;"
            echo "dice que no se sabe. Si al volcado le falta deploy.semilla, la"
            echo "proxima captura con crear-semilla.sh ya la traera (deploy#4)."
            exit 0
          fi

          if [ "$DEL_VOLCADO" = "$DE_LA_API" ]; then
            echo "La semilla de la demo esta al dia con esta API. Nada que hacer."
            exit 0
          fi

          MAS_ALTA=$(printf '%s\n%s\n' "$DEL_VOLCADO" "$DE_LA_API" | sort -V | tail -1)

          if [ "$MAS_ALTA" = "$DEL_VOLCADO" ]; then
            echo "La semilla de la CT (v$DEL_VOLCADO) es MAS NUEVA que esta API (v$DE_LA_API)."
            echo "Esa es la direccion que rompe: si alguien reinicia la demo ahora,"
            echo "Flyway encontrara migraciones que este jar no conoce y la API no"
            echo "arrancara. El sembrar-demo.yml del repositorio deploy no deja"
            echo "sembrar asi; esto solo lo dice, porque el despliegue ya esta hecho."
            exit 0
          fi

          echo "AVISO: la demo se queda con la semilla atrasada."
          echo
          echo "Esta API conoce hasta la v$DE_LA_API y el volcado que sirve la CT se"
          echo "capturo con la v$DEL_VOLCADO. No rompe nada: Flyway aplica lo que falta"
          echo "al arrancar. Pero los recibos del volcado siguen calculados con las"
          echo "reglas de la v$DEL_VOLCADO, asi que si alguna de las migraciones nuevas"
          echo "toca la reglamentacion, la demo ensenara la marca de 'las reglas han"
          echo "cambiado' en todos los recibos, cada manana, y ademas los importes"
          echo "viejos."
          echo
          echo "Como se arregla: lanzar a mano, en el repositorio deploy,"
          echo "  Gitea > Actions > \"Sembrar la demo desde un volcado\""
          echo "con un demo-seed.dump capturado con la v$DE_LA_API. Fabricarlo esta en"
          echo "el FABRICAR-SEMILLA.md de ese repositorio."
          echo
          echo "No se hace solo a proposito: pisar la base de la demo es un gesto"
          echo "que se decide (deploy#13)."
          exit 0

      - name: Recoger los contenedores de los tests y podar el runner
        if: always()
        run: |
          # -v no es opcional: sin el, "docker rm" deja vivo el volumen anonimo
          # del Postgres, ~300 MB por pasada que nadie volvia a tocar. Asi es
          # como se lleno la CT (issue #13).
          docker rm -f -v "${{ env.MVN }}" "${{ env.PG }}" 2>/dev/null || true
          docker network rm "${{ env.RED }}" 2>/dev/null || true

          # Lo que se acumulaba en el runner (issue #13). Esto corre en el dind
          # del act-runner, que nadie mira: "docker system df" en la CT no lo
          # ensena, hay que hacer "docker exec act-runner docker system df".
          #
          # Imagenes: cada build etiqueta con el sha y las deja ahi. Se guardan
          # latest y las dos mas recientes de cada repositorio de b4rrhh, por si
          # hay que volver atras sin pasar por el registry. Las de otros
          # proyectos que comparten el runner no se tocan desde aqui.
          # "docker images" lista de mas nueva a mas vieja.
          for repo in $(docker images --format '{{.Repository}}' \
                          --filter "reference=${{ env.REGISTRY }}/*" | sort -u); do
            docker images "$repo" --format '{{.Tag}}' \
              | grep -v -e '^latest$' -e '^<none>$' \
              | tail -n +3 \
              | xargs -r -I{} docker rmi "$repo:{}" || true
          done
          docker image prune -f || true

          # Cache de build: 144 entradas y 2 GB que no usaba nadie. No se vacia
          # del todo (cada build seria un build desde cero): se tira lo que
          # lleva una semana sin usarse.
          docker builder prune -af --filter until=168h || true
